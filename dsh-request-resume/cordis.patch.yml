# One row: the plugin resumes a turn whose model request failed, in the same
# turn, after the provider adapter's own retry policy has given up. Every
# setting lives on this row because a profile patch that names this id replaces
# the whole `config` map, never merges into it.
- insert:
    - id: request-resume
      name: '@undernapse/dsh-request-resume'
      config:
        # Failure codes worth another request. All are transient by nature; a
        # permanent failure (bad credentials, invalid request, context window)
        # is deliberately absent, because another attempt cannot fix it.
        resumeCodes:
          - TIMEOUT
          - TRANSPORT
          - SERVER
          - RATE_LIMIT
          - STREAM_CLOSED
          - EMPTY_RESPONSE
          - MALFORMED_RESPONSE
        # Requests this plugin may re-send inside one step. The provider
        # adapter's own budget (for example seven retries) runs first, so this
        # counts only the attempts after that budget is spent.
        maxResumes: 3
        # Wait before the first resumed request, doubling up to the cap.
        initialDelayMs: 2000
        maxDelayMs: 60000
        # A provider `Retry-After` longer than this is ignored in favor of the
        # local backoff, so one instruction cannot stall the turn indefinitely.
        maxProviderDelayMs: 300000
        # Stop resuming a step that has been failing for longer than this.
        # 0 disables the window.
        maxStepDurationMs: 600000
        # The same three limits applied across a whole agent turn, so a turn
        # that keeps failing in later steps cannot run forever. Same units.
        maxResumesPerTurn: 6
        maxTurnDurationMs: 1800000
